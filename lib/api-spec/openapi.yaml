      properties:
        days:
          type: integer
        page_views:
          type: integer
        sessions:
          type: integer
        daily:
          type: array
          items:
            $ref: "#/components/schemas/SiteAnalyticsDailyItem"
        top_pages:
          type: array
          items:
            $ref: "#/components/schemas/SiteAnalyticsBreakdownItem"
        top_sources:
          type: array
          items:
            $ref: "#/components/schemas/SiteAnalyticsBreakdownItem"
      required:
        - days
        - page_views
        - sessions
        - daily
        - top_pages
        - top_sources
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

