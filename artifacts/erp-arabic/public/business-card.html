    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px;
    }
    h2 {
      font-family: 'Cairo', sans-serif;
      color: #4a5568;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: -20px;
    }
    .card {
      width: 85mm;
      height: 55mm;
      border-radius: 4mm;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.12);
      flex-shrink: 0;
    }

    /* ═══ FRONT ═══ */
    .card-front {
      background: linear-gradient(135deg, #0a1628 0%, #12223d 60%, #1a3a5c 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6mm 7mm 5mm 7mm;
    }
    .card-front::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5mm;
      background: linear-gradient(90deg, #c8a951, #f0d278, #c8a951);
    }
    .card-front::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 85% 15%, rgba(200,169,81,0.10) 0%, transparent 55%),
        radial-gradient(circle at 10% 85%, rgba(255,255,255,0.04) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .card-bg-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
      display: none;
      overflow: hidden;
    }
    .card-bg-overlay img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .front-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .front-logo { height: 12mm; width: auto; object-fit: contain; }
    .front-tagline {
      font-size: 6px;
      color: #c8a951;
      letter-spacing: 0.4px;
      font-weight: 500;
      text-align: left;
      line-height: 1.5;
      direction: ltr;
    }
    .front-divider { position: relative; z-index: 1; }
    .front-divider hr { border: none; border-top: 0.3mm solid rgba(200,169,81,0.35); }
    .front-bottom { position: relative; z-index: 1; }
    .front-name {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 1mm;
      letter-spacing: 0.2px;
    }
    .front-title {
      font-size: 8px;
      font-weight: 500;
      color: #c8a951;
      letter-spacing: 0.8px;
      margin-bottom: 2mm;
    }
    .front-contact { display: flex; align-items: center; gap: 2mm; direction: ltr; }
    .front-phone {
      font-size: 10.5px;
      font-weight: 600;
      color: #e8e8e8;
      letter-spacing: 0.5px;
      direction: ltr;
    }
    .phone-icon { width: 3.5mm; height: 3.5mm; fill: #c8a951; flex-shrink: 0; }
    .front-company {
      font-size: 6.5px;
      font-weight: 600;
      color: rgba(200,169,81,0.65);
      letter-spacing: 1.5px;
      margin-bottom: 1mm;
    }
    .front-email {
      font-size: 7px;
      color: rgba(200,169,81,0.75);
      direction: ltr;
      margin-top: 0.8mm;
      letter-spacing: 0.3px;
    }
    .back-company {
      font-size: 10px;
      font-weight: 700;
      color: #8b6914;
      letter-spacing: 1px;
    }

    /* ═══ BACK ═══ */
    .card-back {
      background: linear-gradient(145deg, #f8f5ee 0%, #fffdf7 50%, #f5f0e8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5mm 6mm;
      position: relative;
    }
    .card-back::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 4mm;
      border: 0.5mm solid #c8a951;
      pointer-events: none;
    }
    .card-back::after {
      content: '';
      position: absolute;
      top: 3mm; left: 3mm; right: 3mm; bottom: 3mm;
      border: 0.2mm solid rgba(200,169,81,0.3);
      border-radius: 2.5mm;
      pointer-events: none;
    }
    .back-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5mm;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .back-logo { height: 14mm; width: auto; object-fit: contain; opacity: 0.92; }
    .back-ornament {
      width: 30mm; height: 0.4mm;
      background: linear-gradient(90deg, transparent, #c8a951, transparent);
    }
    .back-credit-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5mm;
    }
    .back-credit-row span {
      font-size: 6px;
      color: rgba(139,115,85,0.45);
      font-weight: 500;
      letter-spacing: 0.2px;
      line-height: 1.5;
    }
    .credit-logo {
      height: 4.5mm;
      width: auto;
      object-fit: contain;
      opacity: 0.5;
    }

    /* ═══ Print ═══ */
    .print-note { font-family:'Cairo',sans-serif; font-size:12px; color:#718096; text-align:center; margin-top:-10px; }
    .print-btn {
      background: linear-gradient(135deg,#0a1628,#1a3a5c);
      color: white; border: none;
      padding: 10px 28px; border-radius: 6px;
      font-family:'Cairo',sans-serif; font-size:14px; font-weight:600;
      cursor:pointer; letter-spacing:0.5px;
      box-shadow:0 3px 10px rgba(0,0,0,0.2);
      transition:opacity .2s;
    }
    .print-btn:hover { opacity:.88; }

    .card-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .save-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg,#1a3a5c,#0a1628);
      color: #f0d278; border: 1px solid rgba(200,169,81,0.4);
      padding: 8px 22px; border-radius: 8px;
      font-family:'Cairo',sans-serif; font-size: 13px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.3px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      transition: opacity .18s, transform .15s;
    }
    .save-btn:hover { opacity:.88; transform:translateY(-1px); }
    .save-btn:active { transform:translateY(0); opacity:1; }
    .save-btn.saving { opacity:.55; cursor:wait; }
    .btn-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
    .dl-link {
      display:none; text-decoration:none;
      background: linear-gradient(135deg,#2d6a4f,#1b4332);
      color:#6ee7b7; border:1px solid rgba(52,211,153,0.4);
      padding:8px 22px; border-radius:8px;
      font-family:'Cairo',sans-serif; font-size:13px; font-weight:700;
      cursor:pointer; letter-spacing:0.3px;
      box-shadow:0 3px 12px rgba(0,0,0,0.25);
      transition:opacity .18s, transform .15s;
    }
    .dl-link:hover { opacity:.88; transform:translateY(-1px); }

    @media print {
      @page { size: 85mm 120mm; margin: 0; }
      body { background:white; padding:5mm; gap:5mm; justify-content:flex-start; min-height:unset; }
      h2,.print-note,.print-btn,.save-btn,.dl-link { display:none; }
      .card { box-shadow: none; border: 0.3mm solid #ddd; }
    }
  </style>
</head>
<body>

  <h2>الوجه الأمامي</h2>
  <div class="card-wrap">
  <div class="card card-front" id="card-front" dir="rtl" lang="ar">
    <div id="card-bg-overlay" class="card-bg-overlay"><img id="card-bg-img" src="" alt="" /></div>
    <div class="front-top">
      <img src="/jefer-logo-new.png" alt="JEFER" class="front-logo" />
      <div class="front-tagline" id="tagline">للمقاولات والنقليات<br/>Contracting &amp; Logistics</div>
    </div>
    <div class="front-divider"><hr /></div>
    <div class="front-bottom">
      <div class="front-company" id="company">مجموعة جيفر</div>
      <div class="front-name" id="name">أحمد الرشودي</div>
      <div class="front-title" id="job_title">المدير العام</div>
      <div class="front-contact">
        <svg class="phone-icon" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        <span class="front-phone" id="phone">050 381 888</span>
      </div>
      <div class="front-email" id="email"></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="save-btn" id="convert-front" onclick="convertCard('front','كارت-الوجه-الامامي')">🔄 تحويل إلى PNG</button>
    <a class="dl-link" id="dl-front" download="كارت-الوجه-الامامي.png">⬇ تنزيل الصورة</a>
  </div>
  </div>

  <h2>الوجه الخلفي</h2>
  <div class="card-wrap">
  <div class="card card-back" id="card-back" dir="rtl" lang="ar">
    <div class="back-content">
      <img src="/jefer-logo-new.png" alt="JEFER" class="back-logo" />
      <div class="back-company" id="company-back">مجموعة جيفر</div>
      <div class="back-ornament"></div>
      <div class="back-credit-row">
        <img id="credit-logo" src="" class="credit-logo" style="display:none" alt="" />
        <span id="credit-text">تصميم الكارت والموقع بواسطة MKGH — 0571748340</span>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="save-btn" id="convert-back" onclick="convertCard('back','كارت-الوجه-الخلفي')">🔄 تحويل إلى PNG</button>
    <a class="dl-link" id="dl-back" download="كارت-الوجه-الخلفي.png">⬇ تنزيل الصورة</a>
  </div>
  </div>

  <p class="print-note">للطباعة المباشرة اضغط هنا</p>
  <button class="print-btn" onclick="window.print()">🖨 طباعة الكارت</button>

  <script>
    /* ─── global card data from API ─────────────────────────────────── */
    window._cardData = {};

    /* ─── helpers ────────────────────────────────────────────────────── */
    async function fetchBase64(url) {
      try {
        const r = await fetch(url, { credentials: 'same-origin' });
        if (!r.ok) return null;
        const blob = await r.blob();
        return await new Promise((res, rej) => {
          const rd = new FileReader();
          rd.onload = () => res(rd.result);
          rd.onerror = () => rej(new Error('read err'));
          rd.readAsDataURL(blob);
        });
      } catch { return null; }
    }

    function xmlEsc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function getFontFaceCSS() {
      const style = document.querySelector('style');
      if (!style) return '';
      return (style.textContent.match(/@font-face\s*\{[^}]+\}/g) || []).join('\n');
    }

    function hexGradColors(hex, dir) {
      const r=parseInt(hex.slice(1,3),16)||0, g=parseInt(hex.slice(3,5),16)||0, b=parseInt(hex.slice(5,7),16)||0;
      const cl=(n,a)=>`${Math.max(0,Math.min(255,n+a))}`;
      if (dir==='front') return [`rgb(${cl(r,-25)},${cl(g,-25)},${cl(b,-25)})`, hex, `rgb(${cl(r,20)},${cl(g,20)},${cl(b,20)})`];
      return [`rgb(${cl(r,-3)},${cl(g,-3)},${cl(b,-3)})`,`rgb(${cl(r,5)},${cl(g,5)},${cl(b,5)})`,`rgb(${cl(r,-5)},${cl(g,-5)},${cl(b,-5)})`];
    }

    /* ─── SVG front card ─────────────────────────────────────────────── */
    function buildFrontSVG(d, logoB64, fontCSS) {
      const [fc0,fc1,fc2] = d.front_color ? hexGradColors(d.front_color,'front') : ['#0a1628','#12223d','#1a3a5c'];
      const colName  = d.color_name      || '#ffffff';
      const colTitle = d.color_title     || '#c8a951';
      const colPhone = d.color_phone     || '#e8e8e8';
      const colTag   = d.color_tagline   || '#c8a951';
      const colCompF = d.color_company_f || '#c8a951';
      const colEmail = d.color_email     || '#c8a951';

      const tagEl   = document.getElementById('tagline');
      const tagNodes = tagEl ? [...tagEl.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).filter(Boolean) : [];
      const tagLine1 = tagNodes[0] || 'للمقاولات والنقليات';
      const tagLine2 = tagNodes[1] || 'Contracting & Logistics';

      const name    = xmlEsc(document.getElementById('name')?.textContent     || '');
      const company = xmlEsc(document.getElementById('company')?.textContent  || '');
      const job     = xmlEsc(document.getElementById('job_title')?.textContent|| '');
      const phone   = xmlEsc(document.getElementById('phone')?.textContent    || '');
      const email   = xmlEsc(document.getElementById('email')?.textContent    || '');

      return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2550" height="1650" viewBox="0 0 850 550">
<defs>
<style>${fontCSS}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
  <stop offset="0%" stop-color="${fc0}"/>
  <stop offset="60%" stop-color="${fc1}"/>
  <stop offset="100%" stop-color="${fc2}"/>
</linearGradient>
<linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0%" stop-color="#c8a951"/><stop offset="50%" stop-color="#f0d278"/><stop offset="100%" stop-color="#c8a951"/>
</linearGradient>
</defs>
<!-- background -->
<rect width="850" height="550" rx="38" fill="url(#bg)"/>
<!-- top gold stripe -->
<rect width="850" height="15" rx="6" fill="url(#stripe)"/>
<!-- logo (right side) -->
${logoB64 ? `<image href="${logoB64}" x="490" y="38" width="285" height="118" preserveAspectRatio="xMaxYMid meet"/>` : ''}
<!-- tagline (left side, LTR) -->
<text x="70" y="100" font-family="Cairo,sans-serif" font-size="15" font-weight="500" fill="${colTag}" direction="ltr">${xmlEsc(tagLine1)}</text>
<text x="70" y="120" font-family="Cairo,sans-serif" font-size="15" font-weight="500" fill="${colTag}" direction="ltr">${xmlEsc(tagLine2)}</text>
<!-- divider -->
<line x1="70" y1="200" x2="780" y2="200" stroke="${colTag}" stroke-opacity="0.35" stroke-width="2"/>
<!-- company (RTL, right-aligned) -->
<text x="780" y="232" font-family="Cairo,sans-serif" font-size="17" font-weight="600" fill="${colCompF}" fill-opacity="0.65" text-anchor="start" direction="rtl">${company}</text>
<!-- name -->
<text x="780" y="288" font-family="Cairo,sans-serif" font-size="37" font-weight="800" fill="${colName}" text-anchor="start" direction="rtl">${name}</text>
<!-- title -->
<text x="780" y="323" font-family="Cairo,sans-serif" font-size="21" font-weight="500" fill="${colTitle}" text-anchor="start" direction="rtl">${job}</text>
<!-- phone icon -->
<g transform="translate(70,363) scale(1.15)">
  <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" fill="${colTag}"/>
</g>
<!-- phone number (LTR) -->
<text x="104" y="389" font-family="Cairo,sans-serif" font-size="27" font-weight="600" fill="${colPhone}" direction="ltr">${phone}</text>
${email ? `<!-- email -->
<text x="780" y="424" font-family="Cairo,sans-serif" font-size="18" font-weight="400" fill="${colEmail}" fill-opacity="0.85" text-anchor="end" direction="ltr">${email}</text>` : ''}
</svg>`;
    }

    /* ─── SVG back card ──────────────────────────────────────────────── */
    function buildBackSVG(d, logoB64, fontCSS) {
      const [bc0,bc1,bc2] = d.back_color ? hexGradColors(d.back_color,'back') : ['#f8f5ee','#fffdf7','#f5f0e8'];
      const colCompB  = d.color_company_b || '#8b6914';
      const colCredit = d.color_credit    || '#8b7355';
      const company   = xmlEsc(document.getElementById('company-back')?.textContent || '');
      const credit    = xmlEsc(document.getElementById('credit-text')?.textContent  || '');

      return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2550" height="1650" viewBox="0 0 850 550">
<defs>
<style>${fontCSS}</style>
<linearGradient id="bgb" x1="0" y1="0" x2="0.9" y2="1" gradientUnits="objectBoundingBox">
  <stop offset="0%" stop-color="${bc0}"/>
  <stop offset="50%" stop-color="${bc1}"/>
  <stop offset="100%" stop-color="${bc2}"/>
</linearGradient>
<linearGradient id="orn" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0%" stop-color="transparent"/><stop offset="50%" stop-color="#c8a951"/><stop offset="100%" stop-color="transparent"/>
</linearGradient>
</defs>
<!-- background -->
<rect width="850" height="550" rx="38" fill="url(#bgb)"/>
<!-- outer gold border -->
<rect width="850" height="550" rx="38" fill="none" stroke="#c8a951" stroke-width="5"/>
<!-- inner border -->
<rect x="28" y="28" width="794" height="494" rx="25" fill="none" stroke="#c8a951" stroke-opacity="0.3" stroke-width="2"/>
<!-- logo centered -->
${logoB64 ? `<image href="${logoB64}" x="250" y="118" width="350" height="148" preserveAspectRatio="xMidYMid meet" opacity="0.92"/>` : ''}
<!-- company name -->
<text x="425" y="322" font-family="Cairo,sans-serif" font-size="27" font-weight="700" fill="${colCompB}" text-anchor="middle" direction="rtl">${company}</text>
<!-- ornament line -->
<rect x="275" y="338" width="300" height="4" rx="2" fill="url(#orn)"/>
<!-- credit -->
<text x="425" y="432" font-family="Cairo,sans-serif" font-size="14" font-weight="500" fill="${colCredit}" fill-opacity="0.45" text-anchor="middle">${credit}</text>
</svg>`;
    }

    /* ─── main convert function ──────────────────────────────────────── */
    async function convertCard(side, filename) {
      const btn    = document.getElementById('convert-' + side);
      const dlLink = document.getElementById('dl-' + side);
      dlLink.style.display = 'none';
      btn.classList.add('saving'); btn.textContent = '⏳ جارٍ التحويل…';
      try {
        const d = window._cardData;

        // get logo (API override takes priority, else fetch default)
        const logoImgEl = document.querySelector('.front-logo');
        const logoB64 = (logoImgEl?.src?.startsWith('data:') ? logoImgEl.src : null)
                     || await fetchBase64('/jefer-logo-new.png');

        // extract base64 @font-face rules from embedded style
        const fontCSS = getFontFaceCSS();

        // build SVG
        const svgStr = side === 'front'
          ? buildFrontSVG(d, logoB64, fontCSS)
          : buildBackSVG(d, logoB64, fontCSS);

        // SVG → Image → Canvas → PNG
        const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
        const img = new Image();
        await new Promise((res, rej) => {
          img.onload = res;
          img.onerror = ev => rej(new Error('SVG render failed'));
          img.src = svgUrl;
        });

        const canvas = document.createElement('canvas');
        canvas.width = 2550; canvas.height = 1650;
        canvas.getContext('2d').drawImage(img, 0, 0, 2550, 1650);
        const pngUrl = canvas.toDataURL('image/png');

        dlLink.href = pngUrl;
        dlLink.style.display = 'inline-block';
        btn.classList.remove('saving'); btn.textContent = '✅ جاهز للتنزيل';
      } catch(e) {
        console.error('convertCard:', e);
        btn.classList.remove('saving'); btn.textContent = '❌ ' + (e?.message || String(e));
        setTimeout(() => { btn.textContent = '🔄 تحويل إلى PNG'; }, 4000);
      }
    }

    /* ─── populate card from API ───────────────────────────────────── */
    fetch('/api/portal/business-card')
      .then(r => r.json())
      .then(d => {
        window._cardData = d;
        if (d.name)      document.getElementById('name').textContent = d.name;
        if (d.company)   { document.getElementById('company').textContent = d.company; document.getElementById('company-back').textContent = d.company; }
        if (d.job_title) document.getElementById('job_title').textContent = d.job_title;
        if (d.phone)     document.getElementById('phone').textContent = d.phone;
        if (d.email)     document.getElementById('email').textContent = d.email;
        if (d.tagline)   document.getElementById('tagline').innerHTML = d.tagline.replace(/\n/g,'<br/>');
        if (d.name)      document.title = 'كارت الأعمال — ' + d.name;
        if (d.logo_data) document.querySelectorAll('.front-logo,.back-logo').forEach(img => img.src = d.logo_data);
        /* credit row */
        const ct = [d.credit_text, d.credit_brand, d.credit_phone ? '— ' + d.credit_phone : ''].filter(Boolean).join(' ');
        if (ct) document.getElementById('credit-text').textContent = ct;
        const logoEl = document.getElementById('credit-logo');
        if (d.credit_logo) { logoEl.src = d.credit_logo; logoEl.style.display = 'inline-block'; }
        /* background overlay — use <img> so html-to-image handles it correctly */
        if (d.bg_image) {
          const ov = document.getElementById('card-bg-overlay');
          const bi = document.getElementById('card-bg-img');
          bi.src = d.bg_image;
          bi.style.opacity = (parseFloat(d.bg_opacity ?? '20') / 100).toString();
          ov.style.display = 'block';
        }
        /* card background colors */
        function hexGrad(hex, dir) {
          const r=parseInt(hex.slice(1,3),16)||0, g=parseInt(hex.slice(3,5),16)||0, b=parseInt(hex.slice(5,7),16)||0;
          const cl=(n,a)=>Math.max(0,Math.min(255,n+a));
          if (dir==='front') return `linear-gradient(135deg,rgb(${cl(r,-25)},${cl(g,-25)},${cl(b,-25)}) 0%,${hex} 60%,rgb(${cl(r,20)},${cl(g,20)},${cl(b,20)}) 100%)`;
          return `linear-gradient(145deg,rgb(${cl(r,-3)},${cl(g,-3)},${cl(b,-3)}) 0%,rgb(${cl(r,5)},${cl(g,5)},${cl(b,5)}) 50%,rgb(${cl(r,-5)},${cl(g,-5)},${cl(b,-5)}) 100%)`;
        }
        if (d.front_color) document.getElementById('card-front').style.background = hexGrad(d.front_color,'front');
        if (d.back_color)  document.getElementById('card-back').style.background  = hexGrad(d.back_color,'back');
        /* text colors */
        if (d.color_name)      document.getElementById('name').style.color       = d.color_name;
        if (d.color_title)     document.getElementById('job_title').style.color   = d.color_title;
        if (d.color_phone)     document.getElementById('phone').style.color       = d.color_phone;
        if (d.color_tagline)   { document.getElementById('tagline').style.color   = d.color_tagline;
                                  const ic = document.querySelector('.phone-icon'); if(ic) ic.style.fill = d.color_tagline; }
        if (d.color_company_f) document.getElementById('company').style.color     = d.color_company_f;
        if (d.color_email)     document.getElementById('email').style.color       = d.color_email;
        if (d.color_company_b) document.getElementById('company-back').style.color= d.color_company_b;
        if (d.color_credit)    document.getElementById('credit-text').style.color = d.color_credit;
      })
      .catch(() => {});
  </script>
</body>
</html>
